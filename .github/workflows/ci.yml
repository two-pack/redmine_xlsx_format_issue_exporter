name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      PLUGIN: redmine_xlsx_format_issue_exporter
    defaults:
      run:
        working-directory: redmine
    steps:
      - name: Check out Redmine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redmine/redmine
          ref: master
          path: redmine
          persist-credentials: false

      - name: Check out this plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: redmine/plugins/${{ env.PLUGIN }}
          persist-credentials: false

      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: redmine

      - name: Prepare the test database
        run: |
          printf 'test:\n  adapter: sqlite3\n  database: db/test.sqlite3\n' > config/database.yml
          bundle exec rails db:create db:migrate redmine:plugins:migrate

      - name: Run the tests
        run: bin/rails test "plugins/$PLUGIN/test"
