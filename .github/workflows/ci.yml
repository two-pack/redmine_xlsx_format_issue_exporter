name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'

      - name: Run RuboCop
        run: bash .github/scripts/lint.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      PLUGIN: redmine_xlsx_format_issue_exporter
    defaults:
      run:
        working-directory: redmine
    steps:
      - name: Check out Redmine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redmine/redmine
          ref: master
          path: redmine
          persist-credentials: false

      - name: Check out this plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: redmine/plugins/${{ env.PLUGIN }}
          persist-credentials: false

      - name: Configure the test database
        run: bash "plugins/$PLUGIN/.github/scripts/configure-database.sh"

      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: redmine

      - name: Run the tests
        run: bash "plugins/$PLUGIN/.github/scripts/test.sh"

      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-artifacts
          path: redmine/tmp/capybara
          if-no-files-found: ignore
